name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: xtechjs_ci
          POSTGRES_USER: xtechjs_ci
          POSTGRES_PASSWORD: ci-only-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xtechjs_ci -d xtechjs_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: API tests
        run: pnpm --filter @xtechjs/api test

      - name: Web tests
        run: pnpm --filter @xtechjs/web test

      - name: Production builds
        run: pnpm build

      - name: Run database migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: xtechjs_ci
          POSTGRES_USER: xtechjs_ci
          POSTGRES_PASSWORD: ci-only-database-password
        run: |
          pnpm --filter @xtechjs/api migration:run
          pnpm --filter @xtechjs/api migration:run

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Validate production Compose configuration
        env:
          POSTGRES_DB: xtechjs_ci
          POSTGRES_USER: xtechjs_ci
          POSTGRES_PASSWORD: ci-only-database-password
          JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
          SMTP_HOST: smtp.example.invalid
          SMTP_PORT: "587"
          SMTP_SECURE: "true"
          MAIL_FROM: no-reply@example.invalid
        run: docker compose -f compose.yaml -f compose.production.yaml config --quiet

  docker:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t xtechjs-api:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t xtechjs-web:ci .
